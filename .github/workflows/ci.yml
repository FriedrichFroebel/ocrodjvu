name: CI

on:
- push
- pull_request
- workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  main:
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15-dev']
    runs-on: ubuntu-latest
    name: Python ${{ matrix.python }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        persist-credentials: false
    - name: set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ matrix.python }}
    - name: apt update
      run:
        sudo apt-get update
    - name: apt install deps
      run:
        sudo apt-get install -y
          djvulibre-bin
          docbook-xml
          docbook-xsl
          libdjvulibre-dev
          libicu-dev
          libxml2-utils
          libxslt1-dev
          xsltproc
    - name: apt install OCR packages
      run:
        sudo apt-get install -y
          tesseract-ocr
          cuneiform
          ocrad
          gocr
    - name: update PIP
      run:
        python -m pip install --upgrade pip
    - name: install package
      run:
        python -m pip install .[dev,docs]
    - name: install PyICU
      run:
        python -m pip install pyicu
    - name: install html5lib
      run:
        python -m pip install html5lib
    - name: run tests
      run:
        make test
    - name: determine coverage
      run:
        make update-coverage
    - name: run flake8
      run:
        python -m flake8 .
    - name: check docs
      run:
        make -C doc check
    - name: build docs
      run:
        make -C doc all
    - name: check whether the executables were installed correctly
      run: |
        cd /
        djvu2hocr --version
        hocr2djvused --version
        ocrodjvu --version
    - name: install man page
      run:
        make install_manpage PREFIX=$HOME/.local
    - name: check whether the man pages were installed correctly
      env:
        MANPATH: /home/runner/.local/share/man
        MANWIDTH: 80
      run: |
        cd /
        man 1 ocrodjvu | grep -A 10 -w OCRODJVU
        man 1 djvu2hocr | grep -A 10 -w DJVU2HOCR
        man 1 hocr2djvused | grep -A 10 -w HOCR2DJVUSED
